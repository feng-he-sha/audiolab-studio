[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolab"
version = "0.1.0"
description = "AudioLab Studio - local audio voice/music workbench (vocal/BGM classification, timbre clustering, ffmpeg processing)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AudioLab Studio" }]
keywords = ["audio", "vocal", "timbre", "source-separation", "ffmpeg", "fastapi"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.32",
  "pydantic>=2.9,<3",
  "psutil==7.2.2",
  "pywebview==6.2.1",
  "requests>=2.32",
  "numpy>=2.0,<3",
  "scipy>=1.14",
  "librosa==0.11.0",
  "soundfile==0.14.0",
  "scikit-learn>=1.5",
  "audio-separator[cpu]==0.47.1",
  "transformers==5.20.2",
  "huggingface-hub>=1.31,<2",
  "silero-vad==6.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
audiolab = "audiolab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: requires ML models / GPU",
  "e2e: end-to-end workbench tests",
]
